name: CI

on:
  push:
    branches:
      - main
      - refactor/src-layout
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        env:
          PYTHONPATH: src
        run: python -m compileall src tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  validate-monitoring:
    name: Validate monitoring configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Grafana dashboard JSON
        run: |
          python -m json.tool \
            monitoring/grafana/dashboards/prior-auth-overview.json \
            > /dev/null

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f docker-compose.monitoring.yml \
            config

